name: SewTec CRM - Build & Test Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-build-test:
    name: Build & Publish ASP.NET Core Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend Dependencies
        working-directory: ./backend
        run: dotnet restore

      - name: Build Backend
        working-directory: ./backend
        run: dotnet build --no-restore --configuration Release

      - name: Publish Backend Package
        working-directory: ./backend
        run: dotnet publish --no-build --configuration Release -o ./publish

  frontend-build-test:
    name: Test & Build Next.js Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Core Mutation & Acceptance Tests
        working-directory: ./frontend
        run: npm test

      - name: Build Frontend Application
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5018/api
        run: npm run build
